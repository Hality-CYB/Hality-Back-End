name: CI Pipeline - hality-back

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      # Migrations criadas em paralelo a partir do mesmo down_revision geram
      # mais de um head e quebram `alembic upgrade head` (o git não acusa
      # conflito porque são arquivos diferentes).
      - name: Check single Alembic head
        run: |
          heads=$(uv run alembic heads | grep -c "(head)")
          if [ "$heads" -ne 1 ]; then
            echo "::error::Alembic tem $heads heads. Faça rebase na develop e aponte o down_revision da sua migration para o head atual."
            uv run alembic heads
            exit 1
          fi

  test:
    name: Tests with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: hality
      POSTGRES_PASSWORD: hality
      POSTGRES_DB: hality
      SECRET_KEY: ci-only-secret-with-at-least-32-bytes
      DEBUG: "false"
      DB_ECHO: "false"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hality
          POSTGRES_PASSWORD: hality
          POSTGRES_DB: hality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hality -d hality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head

      # Falha se models e migrations divergirem (ex.: índice ou constraint criados
      # só na migration), antes que um `--autogenerate` proponha removê-los.
      - name: Check models match migrations
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest

  deploy:
    name: Deploy backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Publish validated commit
        env:
          COMMIT_SHA: ${{ github.sha }}
          INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name hality-staging-deploy-back --parameters "Commit=$COMMIT_SHA" --timeout-seconds 2400 --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 240); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo "Deploy concluido: $COMMIT_SHA"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "Deploy falhou: $status (SSM $command_id)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Tempo limite de deploy (SSM $command_id)"; exit 1
