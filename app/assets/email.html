<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
  </head>
  <body style="margin:0;background:#f1f7f6;font-family:Arial,Helvetica,sans-serif;color:#183b3b">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#f1f7f6;padding:28px 12px">
      <tr><td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;background:#fff;border-radius:16px;overflow:hidden">
          <tr><td style="background:#0b776f;padding:24px 28px;color:#fff">
            <img src="cid:cyb-logo" width="48" height="48" alt="Logo Check Your Breath" style="display:inline-block;vertical-align:middle;border:0;margin-right:10px">
            <span style="font-size:20px;font-weight:bold;vertical-align:middle">Check Your Breath</span>
          </td></tr>
          <tr><td style="padding:30px 28px">
            <h1 style="font-size:24px;line-height:1.2;margin:0 0 18px">{title}</h1>
            <p style="font-size:16px;line-height:1.5;margin:0 0 16px">{description}</p>
            <p style="font-size:15px;line-height:1.5;margin:0 0 24px">{detail}</p>
            <a href="{url}" style="display:inline-block;background:#0b776f;color:#fff;text-decoration:none;padding:13px 20px;border-radius:9px;font-weight:bold">{button}</a>
            <p style="font-size:12px;line-height:1.5;color:#617575;margin:24px 0 0">
              Se o botão não abrir, copie este link:<br>
              <a href="{url}" style="color:#0b776f;overflow-wrap:anywhere">{url}</a>
            </p>
          </td></tr>
          <tr><td style="padding:18px 28px;border-top:1px solid #dce9e6;color:#617575;font-size:12px">
            <img src="cid:hality-logo" width="88" alt="Logo Hality" style="display:block;border:0;margin-bottom:8px">
            Hality · Check Your Breath
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
